services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: habitstreak_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: habitstreak
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Express Backend ──────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: habitstreak_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/habitstreak
      PORT: 5000
      NODE_ENV: production
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy

  # ─── React Frontend ───────────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: habitstreak_client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  postgres_data:
