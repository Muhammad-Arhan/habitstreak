version: '3.9'

services:
  # ─── Test PostgreSQL Database ─────────────────────────────────────────────────
  db-test:
    image: postgres:15-alpine
    container_name: habitstreak_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: habitstreak_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Test Runner ─────────────────────────────────────────────────────────────
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: builder
    container_name: habitstreak_test_runner
    environment:
      DATABASE_URL: postgresql://postgres:password@db-test:5432/habitstreak_test
      TEST_DATABASE_URL: postgresql://postgres:password@db-test:5432/habitstreak_test
      NODE_ENV: test
    depends_on:
      db-test:
        condition: service_healthy
    command: >
      sh -c "cd /app/server && npx prisma migrate deploy && cd /app && npm run test"
    volumes:
      - .:/app
      - /app/server/node_modules
      - /app/tests/node_modules
