name: HabitStreak CI Pipeline

# Trigger this pipeline on every push or pull request to the main branch.
# This ensures code is validated before merging and after every commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: lint-and-typecheck
  # Purpose: Catch TypeScript type errors and obvious bugs early, before
  # running any tests. TypeScript's compiler is free, fast, and finds a
  # huge category of bugs that would only surface at runtime otherwise.
  # ─────────────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Generate Prisma client (needed for type checking)
        working-directory: server
        run: npx prisma generate

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Type check server
        working-directory: server
        run: npx tsc --noEmit

      - name: Type check client
        working-directory: client
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: unit-tests
  # Purpose: Run pure unit tests that don't require a database.
  # Unit tests are fast and deterministic. They test business logic in
  # isolation — the streak calculator, date helpers, etc.
  # This job only runs if lint-and-typecheck passes.
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install server dependencies (for imports in tests)
        working-directory: server
        run: npm install

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run unit tests
        working-directory: tests
        run: npx vitest run unit

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: integration-tests
  # Purpose: Test the real Express API against a real PostgreSQL database.
  # GitHub Actions supports "services" which are Docker containers that
  # start alongside your job. We use this to spin up a temporary Postgres DB.
  # This job only runs if unit-tests pass.
  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: habitstreak_test
          POSTGRES_PASSWORD: habitstreak_test
          POSTGRES_DB: habitstreak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            tests/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run database migrations on test DB
        working-directory: server
        env:
          DATABASE_URL: postgresql://habitstreak_test:habitstreak_test@localhost:5432/habitstreak_test
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: tests
        env:
          DATABASE_URL: postgresql://habitstreak_test:habitstreak_test@localhost:5432/habitstreak_test
          TEST_DATABASE_URL: postgresql://habitstreak_test:habitstreak_test@localhost:5432/habitstreak_test
          NODE_ENV: test
        run: npx vitest run integration

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: docker-build
  # Purpose: Verify that both Docker images build successfully.
  # Even if all tests pass, a broken Dockerfile means deployment will fail.
  # This catches issues like missing files, bad COPY paths, or syntax errors.
  # This job only runs if integration-tests pass.
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build server Docker image
        run: |
          docker build \
            -f Dockerfile.server \
            -t habitstreak-server:test \
            .

      - name: Build client Docker image
        run: |
          docker build \
            -f Dockerfile.client \
            -t habitstreak-client:test \
            .

      - name: Confirm images were built
        run: |
          docker images | grep habitstreak
          echo "✅ Both Docker images built successfully."
